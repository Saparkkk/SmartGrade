<!doctype html>
<!-- โหลด static ไฟล์ของ Django -->
{% load static %}
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>เพิ่มนักเรียนใหม่ | SmartGrade</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- โหลด Tailwind CSS ผ่าน CDN สำหรับใช้จัดหน้าตาเว็บ -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<!-- จัดเลย์เอาต์ให้กล่องฟอร์มอยู่กึ่งกลางหน้าจอทั้งแนวตั้งและแนวนอนด้วย Flexbox (flex items-center justify-center) -->
<body class="min-h-screen bg-gray-50 flex items-center justify-center py-10 px-4">

  <!-- กล่องครอบฟอร์มหลัก (พื้นหลังสีขาว, มุมโค้งมน, มีเงา, จำกัดความกว้างสูงสุดที่ max-w-md) -->
  <div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-8 border border-gray-100">
    <h1 class="text-2xl font-bold text-gray-900 mb-6 text-center">เพิ่มนักเรียนใหม่</h1>

    <!-- ========================================== -->
    <!-- ส่วนแจ้งเตือนข้อความ (Alerts) -->
    <!-- ========================================== -->
    <!-- ตรวจสอบว่ามีข้อความ Error หรือแจ้งเตือนถูกส่งมาจากฝั่ง Backend หรือไม่ -->
    {% if messages %}
      {% for message in messages %}
        <!-- แสดงกล่องข้อความแจ้งเตือนสีแดง (มักใช้แจ้งเตือนถ้ารหัสผ่านสั้นไป หรือ Username ซ้ำ) -->
        <div class="mb-4 p-3 rounded-lg text-sm bg-red-50 text-red-700 border border-red-200">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <!-- ========================================== -->
    <!-- ฟอร์มเพิ่มนักเรียนใหม่ (ส่งข้อมูลผ่านเมธอด POST) -->
    <!-- ========================================== -->
    <form method="post" class="space-y-5">
      <!-- Token ป้องกันการโจมตีแบบ CSRF (บังคับต้องมีในฟอร์มของ Django) -->
      {% csrf_token %}
      
      <!-- ฟิลด์: Username (รหัสนักเรียน) -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Username (รหัสนักเรียน)</label>
        <!-- required บังคับให้ผู้ใช้ต้องกรอกข้อมูลช่องนี้ก่อนกดบันทึก -->
        <input type="text" name="username" required 
               class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>

      <!-- ฟิลด์: Password (รหัสผ่าน) -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่าน (Password)</label>
        <input type="password" name="password" required 
               class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>

      <!-- ฟิลด์: Class name (ชื่อห้องเรียน) -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">ห้องเรียน (เช่น ม.4/1)</label>
        <input type="text" name="class_name" required 
               class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>

      <!-- ========================================== -->
      <!-- กลุ่มปุ่มกดยืนยัน / ยกเลิก -->
      <!-- ========================================== -->
      <div class="flex gap-3 pt-2">
        <!-- ปุ่มบันทึก (ประเภท submit เพื่อส่งฟอร์ม) -->
        <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl font-semibold shadow transition">
          บันทึก
        </button>
        <!-- ปุ่มยกเลิก (เป็นลิงก์ a เพื่อกดกลับไปยังหน้ารายชื่อนักเรียนทั้งหมด) -->
        <a href="{% url 'teacher_student_list' %}" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-2.5 rounded-xl font-semibold text-center transition">
          ยกเลิก
        </a>
      </div>
    </form>
    
  </div>

</body>
</html>
